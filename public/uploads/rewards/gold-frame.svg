<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer frame -->
  <rect x="10" y="10" width="180" height="180" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  <!-- Accent dots -->
  <circle cx="100" cy="25" r="3" fill="url(#goldGrad)"/>
  <circle cx="175" cy="100" r="3" fill="url(#goldGrad)"/>
  <circle cx="100" cy="175" r="3" fill="url(#goldGrad)"/>
  <circle cx="25" cy="100" r="3" fill="url(#goldGrad)"/>
</svg>